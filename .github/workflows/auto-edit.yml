name: CrayonJapan auto-edit

# Three ways in:
#   repository_dispatch  - the Apps Script trigger sees a new file in 01_RAW_VIDEO
#                          and posts {"event_type": "raw_video_uploaded"}
#   schedule             - daily check at 13:00 UTC (22:00 JST) so queued GO_
#                          folders publish automatically once 48h have passed
#   workflow_dispatch    - a manual run from the Actions tab or `gh workflow run`
#
# The run checks the 48-hour interval against YouTube. If elapsed, it renders
# up to 1 waiting recording from 01_RAW_VIDEO, uploads it as a public Short to
# @CrayonJapan, writes the package into 02_READY_TO_POST, and moves the raw
# folder to 03_ARCHIVE.

on:
  repository_dispatch:
    types: [raw_video_uploaded]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: Optional label for this manual run
        required: false
        default: manual

permissions:
  contents: read

# One render at a time; a second dispatch waits instead of racing for the same
# raw file. The scan is idempotent, so a queued run simply finds nothing to do.
concurrency:
  group: crayonjapan-auto-edit
  cancel-in-progress: false

jobs:
  edit:
    name: Render and publish the next waiting recording
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DRIVE_RAW_FOLDER_ID: ${{ secrets.DRIVE_RAW_FOLDER_ID }}
      DRIVE_READY_FOLDER_ID: ${{ secrets.DRIVE_READY_FOLDER_ID }}
      DRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.DRIVE_ARCHIVE_FOLDER_ID }}
      GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
      GDRIVE_ACCESS_TOKEN: ${{ github.event.client_payload.drive_token }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - name: Mask the one-time Drive token
        run: |
          if [ -n "${GDRIVE_ACCESS_TOKEN}" ]; then
            echo "::add-mask::${GDRIVE_ACCESS_TOKEN}"
            echo "Using the short-lived token sent by the Apps Script trigger."
          else
            echo "No dispatched token; falling back to the stored Drive token."
          fi

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and the OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libglib2.0-0 fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check Drive credentials
        run: python scripts/verify_drive_access.py

      - name: Render and upload next waiting recording (48h gate)
        run: python main.py --drive-once

      - name: Keep the rendered package for inspection
        if: ${{ always() && hashFiles('output/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ github.run_id }}
          path: |
            output/*_final.mp4
            output/*_artwork.jpg
            output/*_metadata.txt
            output/*_art_metadata.json
          if-no-files-found: ignore
          retention-days: 14
